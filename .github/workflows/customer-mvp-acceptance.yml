name: Customer MVP isolated acceptance
on:
  push:
    branches: [codex/customer-mvp-acceptance-ci]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check out approved production source
        run: |
          cp scripts/customer-mvp-acceptance.mjs /tmp/customer-mvp-acceptance.mjs
          git switch --detach 0c4bd2e6fb01332e23a2afd612ad16f051c4e6d4
          test "$(git rev-parse HEAD)" = 0c4bd2e6fb01332e23a2afd612ad16f051c4e6d4
          test -z "$(git status --porcelain)"
      - run: npm ci --no-audit --no-fund
      - run: npm run db:start
      - run: npx supabase db reset --local
      - run: npx playwright install --with-deps chromium
      - name: Exact-source release guards
        run: npx vitest run tests/unit/hostinger-production-origin.test.ts tests/unit/prepare-release-manifest.test.ts tests/unit/production-runtime-hook.test.ts
      - name: Exact-source account and transport browser acceptance
        run: |
          sed "/if (locale === 'ar') continue;/d" /tmp/customer-mvp-acceptance.mjs > scripts/customer-mvp-acceptance.mjs
          node scripts/customer-mvp-acceptance.mjs
          rm scripts/customer-mvp-acceptance.mjs
          test -z "$(git status --porcelain)"
      - run: npx supabase db reset --local
      - name: Commerce browser acceptance
        run: node scripts/test-commerce-workspace.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: customer-mvp-browser
          path: |
            test-results/customer-mvp-acceptance/
            test-results/store-local-*/*.png
          retention-days: 7

