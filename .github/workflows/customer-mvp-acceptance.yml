name: Customer MVP isolated acceptance
on:
  push:
    branches: [codex/customer-mvp-acceptance-ci]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: git merge-base --is-ancestor 302b6862cb89e7014714fba76449140f07881aaf HEAD
      - run: npm ci --no-audit --no-fund
      - name: Compile production output
        run: APP_URL=http://127.0.0.1:3000 npm run build -- --webpack
      - run: npm run db:start
      - run: npx supabase db reset --local
      - run: npx playwright install --with-deps chromium
      - name: Account and transport browser acceptance
        id: account
        continue-on-error: true
        run: node scripts/customer-mvp-acceptance.mjs
      - run: npx supabase db reset --local
      - name: Commerce browser acceptance
        id: commerce
        continue-on-error: true
        run: node scripts/test-commerce-workspace.mjs
      - name: Require both browser suites
        env:
          ACCOUNT: ${{ steps.account.outcome }}
          COMMERCE: ${{ steps.commerce.outcome }}
        run: test "$ACCOUNT" = success && test "$COMMERCE" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: customer-mvp-browser
          path: |
            test-results/customer-mvp-acceptance/
            test-results/store-local-*/*.png
          retention-days: 7

