# Hosted Staging security settings only. Never push the LOCAL supabase/config.toml.
# Verified Preview origin; rotate these exact URLs together for the next accepted deployment.
project_id = "naql365-staging"
[auth]
site_url = "https://naql365-staging-lc8qnrb3y-naql365.vercel.app"
additional_redirect_urls = ["https://naql365-staging-lc8qnrb3y-naql365.vercel.app/auth/callback?locale=ar", "https://naql365-staging-lc8qnrb3y-naql365.vercel.app/auth/callback?locale=en"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
